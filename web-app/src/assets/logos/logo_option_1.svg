<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="24" fill="transparent" />
  
  <!-- Camera Body Outline -->
  <rect x="10" y="20" width="100" height="80" rx="12" fill="none" stroke="url(#g1)" stroke-width="6" />
  <circle cx="25" cy="35" r="4" fill="url(#g1)" />
  
  <!-- Lens/Aperture -->
  <circle cx="60" cy="60" r="25" fill="none" stroke="url(#g1)" stroke-width="4" />
  <!-- Log lines inside the lens representing aperture -->
  <rect x="45" y="50" width="30" height="4" rx="2" fill="url(#g1)" />
  <rect x="50" y="60" width="20" height="4" rx="2" fill="url(#g1)" />
  <rect x="55" y="70" width="10" height="4" rx="2" fill="url(#g1)" />
</svg>
