<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Transparent background for versatility -->
  <rect width="120" height="120" rx="24" fill="transparent" />

  <!-- The Funnel (Filter) / Code Lines (Logs) -->
  <g transform="translate(0, 10)">
      <!-- Top log line -->
      <rect x="20" y="30" width="80" height="12" rx="6" fill="url(#primaryGradient)" />
      
      <!-- Middle log line -->
      <rect x="35" y="52" width="50" height="12" rx="6" fill="url(#primaryGradient)" opacity="0.8" />
      
      <!-- Bottom log line -->
      <rect x="50" y="74" width="20" height="12" rx="6" fill="url(#primaryGradient)" opacity="0.6" />
  </g>

  <!-- AI Sparkle / Core Node -->
  <circle cx="60" cy="62" r="16" fill="url(#accentGradient)" filter="url(#glow)" />
  <circle cx="60" cy="62" r="6" fill="#ffffff" />
</svg>
